name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: build host binary for syntax-only checks
        run: make host
      - name: fetch PR base for immutable package checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: validate registry, hashes, Lua syntax, and risk policy
        run: |
          if [ -n "$BASE_SHA" ]; then
            python3 scripts/check-modules.py --gg build/gg-host --base-ref "$BASE_SHA"
          else
            python3 scripts/check-modules.py --gg build/gg-host
          fi
          python3 tests/module_security_test.py
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the portable binary
        run: |
          sh scripts/fetch-cosmocc.sh 4.0.2 "$HOME/.cosmocc"
          echo "$HOME/.cosmocc/bin" >> "$GITHUB_PATH"
      - name: build (ape)
        run: make ape
      - name: build (host) + tests
        run: |
          make host
          make test-headless GG=build/gg-host
          python3 tests/pty_test.py build/gg-host
      - name: smoke test the ape
        run: |
          ./bin/gg --version
          GG_PLAIN=1 GG_DIR=$(mktemp -d) ./bin/gg ls
          GG_PLAIN=1 GG_DIR=$(mktemp -d) ./bin/gg hello ci
      - name: self-contained script smoke test
        run: |
          # bundle the ape together with a script and run the copy
          mkdir -p /tmp/pk/assets
          printf 'local M = {}\nM.params={{name="x",pos=1,type="string",default="ci"}}\nfunction M.run(ctx) print("bundled "..tostring(gg.assets.read("note.txt"))..ctx.args.x) return 0 end\nreturn M\n' > /tmp/pk/tool.lua
          echo hello > /tmp/pk/assets/note.txt
          ./bin/gg bundle /tmp/pk/app.gg /tmp/pk/tool.lua /tmp/pk/assets
          GG_PLAIN=1 GG_DIR=$(mktemp -d) /tmp/pk/app.gg tool world
          test -x /tmp/pk/app.gg
      - uses: actions/upload-artifact@v4
        with:
          name: gg-ape
          path: |
            bin/gg
            bin/gg.exe
            bin/gg.com
